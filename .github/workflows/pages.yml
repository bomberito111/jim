name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make repo public and enable Pages
        uses: actions/github-script@v7
        with:
          script: |
            // Make repo public (required for Pages on free plan)
            try {
              await github.rest.repos.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                private: false
              });
              console.log('Repo set to public.');
            } catch (e) {
              console.log('Could not change visibility:', e.message);
            }

            // Enable Pages with GitHub Actions source
            try {
              await github.rest.repos.createPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: 'workflow'
              });
              console.log('Pages site created.');
            } catch (e) {
              if (e.status === 409) {
                console.log('Pages exists, updating source...');
                try {
                  await github.rest.repos.updateInformationAboutPagesSite({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    build_type: 'workflow'
                  });
                  console.log('Pages source updated.');
                } catch (e2) {
                  console.log('Update note:', e2.message);
                }
              } else {
                console.log('Pages create note:', e.message);
              }
            }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
